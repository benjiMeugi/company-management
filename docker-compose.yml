services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_ROOT_HOST: "%"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d
    ports:
      - "${MYSQL_PORT}:3306"
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 10

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "${PHPMYADMIN_PORT}:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  authentication-api:
    build:
      context: ./backends/authentication-api
    container_name: authentication-api
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: authentication_db
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./backends/authentication-api:/var/www/authentication-api
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  employe-api:
    build:
      context: ./backends/employe-api
    container_name: employe-api
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: employee_db
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./backends/employe-api:/var/www/employe-api
    depends_on:
      mysql:
        condition: service_healthy
      authentication-api:
        condition: service_started
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "${AUTH_API_PORT}:8081"
      - "${EMPLOYEE_API_PORT}:8082"
    volumes:
      - ./backends/employe-api:/var/www/employe-api
      - ./backends/authentication-api:/var/www/authentication-api
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/logs:/var/log/nginx
    depends_on:
      - employe-api
      - authentication-api
    networks:
      - app_network
      
volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge