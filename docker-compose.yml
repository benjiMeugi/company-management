  #   networks:
  #     - app_network

  # ---- employe ----

  employe-api:
    build:
      context: ./backends/employe-api
    container_name: employe-api
    restart: unless-stopped
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: employee_db
      DB_USERNAME: root
      DB_PASSWORD: root
    volumes:
      - ./backends/employe-api/src:/var/www/employe-api
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ./backends/employe-api/src:/var/www/employe-api
      # - ./backends/auth-user-api/src:/var/www/auth-user-api
      - ./nginx/conf.d:/etc/nginx/conf.d
    depends_on:
      - employe-api
      # - auth-user-api
    networks:
      - app_network

volumes:
  mysql_data:

networks:
  app_network:
    driver: bridge